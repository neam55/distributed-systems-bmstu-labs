name: Build, Test and Deploy

on:
  push:
    branches: [main, 'lab*']
  pull_request:
    branches: [main, 'lab*']

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/person-service

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests (pytest)
        run: pytest -v

  build-and-push:
    name: Build and Push Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:latest
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Секреты RENDER_* заведены как environment secrets — без этой строки job их не получит.
    environment: RENDER
    env:
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          case "$RENDER_SERVICE_ID" in
            srv-*) ;;
            "") echo "::error::RENDER_SERVICE_ID secret is not set"; exit 1 ;;
            *) echo "::error::RENDER_SERVICE_ID must be the service id (srv-xxxxxxxx), not a URL"; exit 1 ;;
          esac
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY secret is not set"; exit 1
          fi

      # Деплой строго через REST API: ни Heroku CLI, ни webhooks не используются.
      - name: Trigger deploy
        id: trigger
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -d "{\"imageUrl\": \"${IMAGE}\"}")
          echo "Render API responded HTTP ${HTTP_CODE}:"
          cat response.json; echo
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Render rejected the deploy request (HTTP ${HTTP_CODE}), see body above"
            exit 1
          fi
          echo "deploy_id=$(jq -r '.id' response.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        run: |
          for _ in $(seq 1 60); do
            STATUS=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${{ steps.trigger.outputs.deploy_id }}" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "Deploy status: $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed) exit 1 ;;
            esac
            sleep 10
          done
          echo "Deploy did not become live in time"
          exit 1

  integration-tests:
    name: Integration Tests (newman)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install newman
        run: npm install -g newman

      - name: Warm up service
        run: |
          BASE_URL=$(jq -r '.values[] | select(.key=="baseUrl") | .value' \
            "postman/[inst][heroku] Lab1.postman_environment.json")
          for _ in $(seq 1 12); do
            if curl -sSf --max-time 20 "$BASE_URL/manage/health" > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 10
          done
          echo "Service did not respond in time"
          exit 1

      - name: Run Postman collection
        run: |
          newman run "postman/[inst] Lab1.postman_collection.json" \
            -e "postman/[inst][heroku] Lab1.postman_environment.json" \
            --delay-request 100 \
            --reporters cli
