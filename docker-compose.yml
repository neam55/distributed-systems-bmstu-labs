services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # Скрипты верхнего уровня создают пользователя, базы и схемы с тестовыми данными.
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  loyalty-service:
    build:
      context: .
      dockerfile: services/loyalty/Dockerfile
    container_name: loyalty-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://program:test@postgres:5432/loyalties
      PORT: 8050
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/manage/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: payment-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://program:test@postgres:5432/payments
      PORT: 8060
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8060/manage/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  reservation-service:
    build:
      context: .
      dockerfile: services/reservation/Dockerfile
    container_name: reservation-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://program:test@postgres:5432/reservations
      PORT: 8070
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/manage/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    restart: on-failure
    environment:
      RESERVATION_SERVICE_URL: http://reservation-service:8070
      PAYMENT_SERVICE_URL: http://payment-service:8060
      LOYALTY_SERVICE_URL: http://loyalty-service:8050
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      loyalty-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/manage/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
